<!DOCTYPE html>
<html>
<body>
  <h1>GitHub Proxy Test</h1>
  <pre id="output">Loading…</pre>

  <script>
    async function test() {
      const url =
        "/api/proxy?url=" +
        encodeURIComponent(
          "https://raw.githubusercontent.com/octocat/Hello-World/master/README"
        );

      const res = await fetch(url);
      document.getElementById("output").textContent = await res.text();
    }

    test();
  </script>
</body>
</html>
