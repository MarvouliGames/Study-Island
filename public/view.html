<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Island | Learner</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Topbar */
    #topbar {
      background: #1b1b1b;
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    #topbar button {
      background: #2a2a2a;
      border: none;
      color: #ccc;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    #topbar button:hover {
      background: #3a3a3a;
    }

    #urlbar {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: #2a2a2a;
      color: #eee;
      font-size: 15px;
    }

    #content {
      flex: 1;
      overflow: auto;
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>

  <!-- Top Navigation Bar -->
  <div id="topbar">
    <button id="backBtn">⟵</button>
    <button id="forwardBtn">⟶</button>
    <button id="reloadBtn">⟳</button>
    <input id="urlbar" placeholder="Enter a URL…" />
  </div>

  <!-- DOM-injected content -->
  <div id="content"></div>

  <!-- DOM Proxy Loader -->
  <script src="/uv/uv.dom.client.js?v=auto"></script>
<script>
  const encoded = new URL(location.href).searchParams.get("url");

  // Only load if a URL was provided
  if (encoded) {
    UVDOM.load(encoded);
  }


    // Update URL bar when DOM sets document.title
    const titleObserver = new MutationObserver(() => {
      document.title = document.querySelector("title")?.innerText || "Proxy";
    });
    titleObserver.observe(document.head, { childList: true, subtree: true });

    // Navigation buttons
    backBtn.onclick = () => history.back();
    forwardBtn.onclick = () => history.forward();
    reloadBtn.onclick = () => location.reload();

    // URL bar navigation
    urlbar.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        let raw = urlbar.value.trim();
        if (!raw.startsWith("http")) raw = "https://" + raw;
        const encoded = btoa(raw);
        location.href = `/view.html?url=${encoded}`;
      }
    });

    // Sync URL bar with current page
    const syncUrl = () => {
      try {
        const current = document.querySelector("base")?.href || "";
        if (current) urlbar.value = current;
      } catch {}
    };
    setInterval(syncUrl, 500);

    // Favicon rewriting
    const faviconObserver = new MutationObserver(() => {
      const link = document.querySelector("link[rel='icon']");
      if (link) {
        const href = link.getAttribute("href");
        if (href && !href.startsWith("/api/learner/")) {
          const resolved = new URL(href, location.href).href;
          const encoded = btoa(resolved);
          link.href = `/api/learner/${encoded}`;
        }
      }
    });
    faviconObserver.observe(document.head, { childList: true, subtree: true });
  </script>

</body>
</html>
