<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Study Island | Learner</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #topbar {
      height: 50px;
      background: #222;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
      box-sizing: border-box;
    }

    #url {
      flex: 1;
      height: 32px;
      border: none;
      border-radius: 4px;
      padding: 0 10px;
      font-size: 14px;
      outline: none;
    }

    #go {
      height: 32px;
      padding: 0 12px;
      border: none;
      border-radius: 4px;
      background: #4a8;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    #frame {
      width: 100vw;
      height: calc(100vh - 50px);
      border: none;
      background: white;
    }
  </style>

  <!-- UV Client -->
  <script src="/uv/uv.client.js"></script>
</head>

<body>
  <div id="topbar">
    <input id="url" placeholder="Enter a URL…" />
    <button id="go">Go</button>
  </div>

  <iframe id="frame"></iframe>

  <script>
    // Initialize UV client
    const uv = new UVClient({
      prefix: "/api/learner/",
      bare: "/api/bare/"
    });

    const urlInput = document.getElementById("url");
    const frame = document.getElementById("frame");
    const goBtn = document.getElementById("go");

    // Load ?url=<encoded> on page load
    const params = new URLSearchParams(location.search);
    const encoded = params.get("url");

    if (encoded) {
      const decoded = uv.decodeUrl(encoded);
      urlInput.value = decoded;
      frame.src = uv.prefix + encoded;
    }

    async function navigate() {
      let raw = urlInput.value.trim();
      if (!raw) return;

      if (!raw.startsWith("http://") && !raw.startsWith("https://")) {
        raw = "https://" + raw;
      }

      const encoded = uv.encodeUrl(raw);
      const proxied = uv.prefix + encoded;

      frame.src = proxied;

      // Update URL bar in browser
      history.replaceState({}, "", "/view.html?url=" + encoded);
    }

    goBtn.onclick = navigate;

    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") navigate();
    });

    // Register UV service worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/uv.sw.js");
    }
  </script>
</body>
</html>
