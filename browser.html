<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Browser</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #topbar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #eee;
      border-bottom: 1px solid #ccc;
    }
    #url {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }
    #go {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    #content {
      flex: 1;
      overflow: auto;
      background: white;
    }
  </style>
</head>

<body>

  <div id="topbar">
    <input id="url" placeholder="https://example.com">
    <button id="go">Go</button>
  </div>

  <div id="content">Enter a URL and press Go.</div>

  <script>
    const input = document.getElementById("url");
    const content = document.getElementById("content");

    let currentUrl = "";

    function proxify(url) {
      return "/api/proxy?url=" + encodeURIComponent(url);
    }

    function absolutify(base, relative) {
      try {
        return new URL(relative, base).toString();
      } catch {
        return relative;
      }
    }

    function normalizeURL(url) {
      try {
        return new URL(url).toString();
      } catch {
        try {
          return new URL("https://" + url).toString();
        } catch {
          return null;
        }
      }
    }

    // Rewrite ALL resources so modern sites load through the proxy
    function rewriteAllResources(doc) {
      const attrs = [
        ["a", "href"],
        ["link", "href"],
        ["script", "src"],
        ["img", "src"],
        ["iframe", "src"],
        ["audio", "src"],
        ["video", "src"],
        ["source", "src"]
      ];

      for (const [tag, attr] of attrs) {
        doc.querySelectorAll(`${tag}[${attr}]`).forEach(el => {
          const val = el.getAttribute(attr);
          if (!val || val.startsWith("javascript:")) return;

          const abs = absolutify(currentUrl, val);
          el.setAttribute(attr, proxify(abs));
        });
      }

      // CSS url(...) inside <style> blocks
      doc.querySelectorAll("style").forEach(style => {
        style.textContent = style.textContent.replace(/url\((.*?)\)/g, (match, p1) => {
          const cleaned = p1.replace(/['"]/g, "").trim();
          if (!cleaned) return match;
          const abs = absolutify(currentUrl, cleaned);
          return `url(${proxify(abs)})`;
        });
      });
    }

    async function loadURL(url) {
      if (!url) return;

      const normalized = normalizeURL(url);
      if (!normalized) {
        content.textContent = "Invalid URL";
        return;
      }

      url = normalized;
      currentUrl = url;
      input.value = url;
      content.innerHTML = "Loading…";

      try {
        const res = await fetch(proxify(url));
        const html = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        rewriteAllResources(doc);

        content.innerHTML = "";
        Array.from(doc.body.childNodes).forEach(node => {
          content.appendChild(node);
        });

        document.title = doc.title || "Browser";

      } catch (e) {
        content.textContent = "Failed to load: " + e.message;
      }
    }

    document.getElementById("go").onclick = () => loadURL(input.value);

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") loadURL(input.value);
    });
  </script>

</body>
</html>
