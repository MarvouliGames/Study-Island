<body>
  <div id="topbar">...</div>
  <div id="content">...</div>

<script>
  const input = document.getElementById("url");
  const content = document.getElementById("content");

  let currentUrl = null;

  function proxify(url) {
    return "/api/proxy?url=" + encodeURIComponent(url);
  }

  function absolutify(base, relative) {
    try {
      return new URL(relative, base).toString();
    } catch {
      return relative;
    }
  }

  // ⭐ Link + form rewriting (the only rewriting we do)
  function rewriteLinks(doc) {
    // Rewrite <a href>
    doc.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href");
      if (!href || href.startsWith("javascript:")) return;

      const abs = absolutify(currentUrl, href);

      a.addEventListener("click", ev => {
        ev.preventDefault();
        loadURL(abs);
      });

      a.setAttribute("href", "#");
    });

    // Rewrite <form action>
    doc.querySelectorAll("form[action]").forEach(form => {
      const action = form.getAttribute("action");
      if (!action) return;

      const abs = absolutify(currentUrl, action);
      form.setAttribute("action", proxify(abs));
    });
  }

  async function loadURL(url) {
    if (!url) return;

    // Add https:// if missing
    if (!url.startsWith("http://") && !url.startsWith("https://")) {
      url = "https://" + url;
    }

    currentUrl = url;
    input.value = url;
    content.innerHTML = "Loading…";

    try {
      const res = await fetch(proxify(url));
      const html = await res.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      // ⭐ Apply link rewriting
      rewriteLinks(doc);

      // Inject HTML body
      content.innerHTML = "";
      Array.from(doc.body.childNodes).forEach(node => {
        content.appendChild(node);
      });

      document.title = doc.title || "Browser";

    } catch (e) {
      content.textContent = "Failed to load: " + e.message;
    }
  }

  document.getElementById("go").onclick = () => loadURL(input.value);

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") loadURL(input.value);
  });

  // Optional: load ?url= parameter
  const params = new URLSearchParams(location.search);
  const startUrl = params.get("url");
  if (startUrl) loadURL(startUrl);
</script>
</body>
