<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Browser</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #topbar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #eee;
      border-bottom: 1px solid #ccc;
    }
    #url {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }
    #go {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    #content {
      flex: 1;
      overflow: auto;
      background: white;
    }
  </style>
</head>

<body>

  <div id="topbar">
    <input id="url" placeholder="https://example.com">
    <button id="go">Go</button>
  </div>

  <div id="content">Enter a URL and press Go.</div>

<script>
  const input = document.getElementById("url");
  const content = document.getElementById("content");

  let currentUrl = "";

  function proxify(url) {
    return "/api/proxy?url=" + encodeURIComponent(url);
  }

  function absolutify(base, relative) {
    if (!base) return relative;
    try {
      return new URL(relative, base).toString();
    } catch {
      return relative;
    }
  }

  // ⭐ Link rewriting ONLY — no other rewriting
  function rewriteLinks(doc) {
    doc.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href");
      if (!href || href.startsWith("javascript:")) return;

      const abs = absolutify(currentUrl, href);

      a.addEventListener("click", ev => {
        ev.preventDefault();
        loadURL(abs);
      });

      a.setAttribute("href", "#");
    });
  }

  async function loadURL(url) {
    if (!url) return;

    if (!url.startsWith("http://") && !url.startsWith("https://")) {
      url = "https://" + url;
    }

    currentUrl = url;
    input.value = url;
    content.innerHTML = "Loading…";

    try {
      const res = await fetch(proxify(url));
      const html = await res.text();

      // ⭐ Parse full HTML (including <head>)
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      rewriteLinks(doc);

      // ⭐ Inject the ENTIRE <html> content safely
      const newDoc = document.implementation.createHTMLDocument("");
      newDoc.documentElement.innerHTML = doc.documentElement.innerHTML;

      // ⭐ Replace only the content area, not the whole page
      content.innerHTML = "";
      Array.from(newDoc.body.childNodes).forEach(node => {
        content.appendChild(node);
      });

      document.title = newDoc.title || "Browser";

    } catch (e) {
      content.textContent = "Failed to load: " + e.message;
    }
  }

  document.getElementById("go").onclick = () => loadURL(input.value);

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") loadURL(input.value);
  });
</script>

</body>
</html>
