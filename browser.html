<script>
  const input = document.getElementById("url");
  const content = document.getElementById("content");

  // 🔧 FIX: don't start as null; start as empty string
  let currentUrl = "";

  function proxify(url) {
    return "/api/proxy?url=" + encodeURIComponent(url);
  }

  function absolutify(base, relative) {
    // 🔧 FIX: if we don't have a base yet, just return the relative as-is
    if (!base) return relative;
    try {
      return new URL(relative, base).toString();
    } catch {
      return relative;
    }
  }

  // ✅ Only added behavior: make links navigate through loadURL
  function rewriteLinks(doc) {
    doc.querySelectorAll("a[href]").forEach(a => {
      const href = a.getAttribute("href");
      if (!href || href.startsWith("javascript:")) return;

      const abs = absolutify(currentUrl, href);

      a.addEventListener("click", ev => {
        ev.preventDefault();
        loadURL(abs);
      });

      a.setAttribute("href", "#");
    });
  }

  async function loadURL(url) {
    if (!url) return;

    if (!url.startsWith("http://") && !url.startsWith("https://")) {
      url = "https://" + url;
    }

    // 🔧 currentUrl is always a string now
    currentUrl = url;
    input.value = url;
    content.innerHTML = "Loading…";

    try {
      const res = await fetch(proxify(url));
      const html = await res.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      // ✅ Only extra behavior: rewrite links
      rewriteLinks(doc);

      content.innerHTML = "";
      Array.from(doc.body.childNodes).forEach(node => {
        content.appendChild(node);
      });

      document.title = doc.title || "Browser";

    } catch (e) {
      content.textContent = "Failed to load: " + e.message;
    }
  }

  document.getElementById("go").onclick = () => loadURL(input.value);

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") loadURL(input.value);
  });
</script>
