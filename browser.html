<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Study Island Browser</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f0f0f0;
      --fg: #111;
      --panel: #ffffff;
      --border: #ccc;
      --accent: #0070f3;
      --accent-soft: #e0efff;
    }
    body.dark {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --panel: #020617;
      --border: #1f2937;
      --accent: #38bdf8;
      --accent-soft: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #topbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    #tabs {
      display: flex;
      gap: 4px;
      margin-right: 8px;
      max-width: 40%;
      overflow-x: auto;
    }

    .tab {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
    }

    button {
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--fg);
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }

    #url {
      flex: 1;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
    }

    #mode, #darkToggle {
      font-size: 11px;
    }

    #contentWrapper {
      flex: 1;
      display: flex;
      background: var(--bg);
    }

    .page {
      flex: 1;
      overflow: auto;
      background: var(--panel);
      padding: 10px;
      display: none;
    }
    .page.active {
      display: block;
    }

    #statusbar {
      font-size: 11px;
      padding: 4px 8px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #spinner {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
      display: none;
    }
    #spinner.active {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="topbar">
    <div id="tabs"></div>
    <div id="controls">
      <button id="backBtn">←</button>
      <button id="fwdBtn">→</button>
      <input id="url" placeholder="https://example.com">
      <button id="goBtn">Go</button>
      <select id="mode">
        <option value="full">Full (HTML+CSS+JS)</option>
        <option value="htmlcss">HTML+CSS</option>
        <option value="html">HTML only</option>
      </select>
      <button id="darkToggle">Dark</button>
      <button id="newTabBtn">+</button>
    </div>
  </div>

  <div id="contentWrapper"></div>

  <div id="statusbar">
    <div>
      <span id="spinner"></span>
      <span id="statusText">Ready.</span>
    </div>
    <span id="titleText"></span>
  </div>

  <script>
    // --- State ---
    const tabs = [];
    let activeTabId = null;

    const tabsEl = document.getElementById("tabs");
    const contentWrapper = document.getElementById("contentWrapper");
    const urlInput = document.getElementById("url");
    const goBtn = document.getElementById("goBtn");
    const backBtn = document.getElementById("backBtn");
    const fwdBtn = document.getElementById("fwdBtn");
    const modeSelect = document.getElementById("mode");
    const darkToggle = document.getElementById("darkToggle");
    const newTabBtn = document.getElementById("newTabBtn");
    const spinner = document.getElementById("spinner");
    const statusText = document.getElementById("statusText");
    const titleText = document.getElementById("titleText");

    function setStatus(msg) {
      statusText.textContent = msg;
    }
    function setLoading(isLoading) {
      spinner.classList.toggle("active", isLoading);
    }

    function proxify(url) {
      return "/api/proxy?url=" + encodeURIComponent(url);
    }
    function absolutify(base, relative) {
      try {
        return new URL(relative, base).toString();
      } catch {
        return relative;
      }
    }

    // --- Tab management ---
    function createTab(initialUrl) {
      const id = "tab-" + Math.random().toString(36).slice(2);
      const pageEl = document.createElement("div");
      pageEl.className = "page";
      pageEl.dataset.tabId = id;
      pageEl.textContent = "New tab.";
      contentWrapper.appendChild(pageEl);

      const tab = {
        id,
        title: "New Tab",
        url: null,
        history: [],
        historyIndex: -1,
        pageEl
      };
      tabs.push(tab);
      renderTabs();
      setActiveTab(id);

      if (initialUrl) {
        navigateTo(initialUrl, true);
      }
    }

    function renderTabs() {
      tabsEl.innerHTML = "";
      tabs.forEach(tab => {
        const btn = document.createElement("button");
        btn.className = "tab" + (tab.id === activeTabId ? " active" : "");
        btn.textContent = tab.title.slice(0, 18) || "New Tab";
        btn.onclick = () => setActiveTab(tab.id);
        tabsEl.appendChild(btn);
      });
    }

    function getActiveTab() {
      return tabs.find(t => t.id === activeTabId) || null;
    }

    function setActiveTab(id) {
      activeTabId = id;
      tabs.forEach(tab => {
        tab.pageEl.classList.toggle("active", tab.id === id);
      });
      renderTabs();
      syncUIWithTab();
    }

    function syncUIWithTab() {
      const tab = getActiveTab();
      if (!tab) return;
      urlInput.value = tab.url || "";
      titleText.textContent = tab.title || "";
      backBtn.disabled = tab.historyIndex <= 0;
      fwdBtn.disabled = tab.historyIndex < 0 || tab.historyIndex >= tab.history.length - 1;
    }

    // --- Rewriters ---
    function rewriteCSSUrls(text, baseUrl) {
      return text.replace(/url\((.*?)\)/g, (m, p1) => {
        const clean = p1.trim().replace(/^['"]|['"]$/g, "");
        if (!clean || clean.startsWith("data:")) return m;
        const abs = absolutify(baseUrl, clean);
        return `url(${proxify(abs)})`;
      }).replace(/@import\s+['"](.*?)['"]/g, (m, p1) => {
        const abs = absolutify(baseUrl, p1);
        return `@import "${proxify(abs)}"`;
      });
    }

    function rewriteDocument(doc, tab, mode) {
      const baseUrl = tab.url;

      // Resources: img, script, link, video, audio, source
      const resSelectors = ["img", "script", "link", "video", "audio", "source"];
      resSelectors.forEach(tag => {
        doc.querySelectorAll(tag).forEach(el => {
          const attr = el.tagName === "LINK" ? "href" : "src";
          const val = el.getAttribute(attr);
          if (!val) return;
          if (mode === "html") {
            // strip scripts/styles in HTML-only
            if (tag === "script" || tag === "link") {
              el.remove();
              return;
            }
          }
          const abs = absolutify(baseUrl, val);
          el.setAttribute(attr, proxify(abs));
        });
      });

      // srcset and picture/source
      doc.querySelectorAll("img[srcset], source[srcset]").forEach(el => {
        const srcset = el.getAttribute("srcset");
        if (!srcset) return;
        const parts = srcset.split(",").map(p => p.trim()).filter(Boolean);
        const rewritten = parts.map(part => {
          const [url, size] = part.split(/\s+/, 2);
          const abs = absolutify(baseUrl, url);
          return proxify(abs) + (size ? " " + size : "");
        }).join(", ");
        el.setAttribute("srcset", rewritten);
      });

      // Lazy-load attributes
      ["data-src", "data-original", "data-lazy-src"].forEach(attr => {
        doc.querySelectorAll("[" + attr + "]").forEach(el => {
          const val = el.getAttribute(attr);
          if (!val) return;
          const abs = absolutify(baseUrl, val);
          el.setAttribute("src", proxify(abs));
        });
      });

      // CSS: <style> blocks
      doc.querySelectorAll("style").forEach(style => {
        style.textContent = rewriteCSSUrls(style.textContent, baseUrl);
      });

      // Inline styles
      doc.querySelectorAll("[style]").forEach(el => {
        el.style.cssText = rewriteCSSUrls(el.style.cssText, baseUrl);
      });

      // Links
      doc.querySelectorAll("a[href]").forEach(a => {
        const href = a.getAttribute("href");
        if (!href || href.startsWith("javascript:")) return;
        const abs = absolutify(baseUrl, href);
        a.addEventListener("click", e => {
          e.preventDefault();
          navigateTo(abs, true);
        });
        a.setAttribute("href", "#");
      });

      // Forms
      doc.querySelectorAll("form").forEach(form => {
        const action = form.getAttribute("action") || baseUrl;
        const abs = absolutify(baseUrl, action);
        form.setAttribute("action", proxify(abs));
      });

      // Meta refresh
      doc.querySelectorAll('meta[http-equiv="refresh"]').forEach(meta => {
        const content = meta.getAttribute("content") || "";
        const match = content.match(/url=(.*)$/i);
        if (match) {
          const target = absolutify(baseUrl, match[1].trim());
          setTimeout(() => navigateTo(target, true), 2000);
        }
      });

      // Simple JS URL rewrites (fetch / XHR)
      if (mode === "full") {
        doc.querySelectorAll("script").forEach(script => {
          if (script.src) return; // already proxified above
          const code = script.textContent;
          if (!code) return;
          let rewritten = code.replace(/fetch\(['"](.*?)['"]\)/g, (m, p1) => {
            const abs = absolutify(baseUrl, p1);
            return `fetch("${proxify(abs)}")`;
          });
          rewritten = rewritten.replace(/new XMLHttpRequest\(\)/g, "new XMLHttpRequest()");
          // we can't safely rewrite all XHR open() calls, but we leave basic fetch patched
          script.textContent = rewritten;
        });
      } else {
        // strip inline scripts in non-full modes
        doc.querySelectorAll("script:not([src])").forEach(s => s.remove());
      }
    }

    // --- Navigation / history ---
    async function navigateTo(url, pushHistory) {
      const tab = getActiveTab();
      if (!tab) return;

      if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
      }

      setLoading(true);
      setStatus("Loading " + url + " …");
      tab.pageEl.innerHTML = "Loading…";
      tab.url = url;
      syncUIWithTab();

      try {
        const mode = modeSelect.value;
        const res = await fetch(proxify(url));
        const ct = res.headers.get("content-type") || "";

        if (!res.ok) {
          const text = await res.text();
          tab.pageEl.textContent = "Error " + res.status + ":\n" + text;
          setStatus("Error " + res.status);
          setLoading(false);
          return;
        }

        if (!ct.includes("text/html")) {
          const text = await res.text();
          tab.pageEl.textContent = text;
          tab.title = url;
          renderTabs();
          titleText.textContent = tab.title;
          setStatus("Loaded as text (" + ct + ")");
          setLoading(false);
          if (pushHistory) {
            tab.history = tab.history.slice(0, tab.historyIndex + 1);
            tab.history.push(url);
            tab.historyIndex++;
          }
          syncUIWithTab();
          return;
        }

        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        rewriteDocument(doc, tab, mode);

        tab.pageEl.innerHTML = "";
        Array.from(doc.body.childNodes).forEach(n => tab.pageEl.appendChild(n));

        tab.title = doc.title || url;
        renderTabs();
        titleText.textContent = tab.title;

        if (pushHistory) {
          tab.history = tab.history.slice(0, tab.historyIndex + 1);
          tab.history.push(url);
          tab.historyIndex++;
        }

        setStatus("Loaded " + url);
      } catch (e) {
        tab.pageEl.textContent = "Failed to load: " + e.message;
        setStatus("Failed");
      } finally {
        setLoading(false);
        syncUIWithTab();
      }
    }

    function goBack() {
      const tab = getActiveTab();
      if (!tab) return;
      if (tab.historyIndex <= 0) return;
      tab.historyIndex--;
      const url = tab.history[tab.historyIndex];
      navigateTo(url, false);
    }

    function goForward() {
      const tab = getActiveTab();
      if (!tab) return;
      if (tab.historyIndex >= tab.history.length - 1) return;
      tab.historyIndex++;
      const url = tab.history[tab.historyIndex];
      navigateTo(url, false);
    }

    // --- UI events ---
    goBtn.onclick = () => {
      const val = urlInput.value.trim();
      if (!val) return;
      navigateTo(val, true);
    };
    urlInput.addEventListener("keydown", e => {
      if (e.key === "Enter") goBtn.click();
    });
    backBtn.onclick = goBack;
    fwdBtn.onclick = goForward;

    newTabBtn.onclick = () => createTab(null);

    darkToggle.onclick = () => {
      document.body.classList.toggle("dark");
      darkToggle.textContent = document.body.classList.contains("dark") ? "Light" : "Dark";
    };

    // --- Init ---
    (function init() {
      document.body.classList.add("dark"); // start dark
      darkToggle.textContent = "Light";

      createTab(null);

      const params = new URLSearchParams(location.search);
      const startUrl = params.get("url");
      if (startUrl) {
        navigateTo(startUrl, true);
      } else {
        const tab = getActiveTab();
        if (tab) {
          tab.pageEl.textContent = "Enter a URL and press Go.";
        }
      }
    })();
  </script>

</body>
</html>
