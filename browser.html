<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Browser</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #topbar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #eee;
      border-bottom: 1px solid #ccc;
    }
    #url {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }
    #go {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    #content {
      flex: 1;
      overflow: auto;
      background: white;
    }
  </style>
</head>

<body>

  <div id="topbar">
    <input id="url" placeholder="https://example.com">
    <button id="go">Go</button>
  </div>

  <div id="content">Enter a URL and press Go.</div>

  <script>
    const PREFIX = "/learner/";

    function encode(str) {
      return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function normalizeURL(url) {
      try { return new URL(url).toString(); }
      catch {
        try { return new URL("https://" + url).toString(); }
        catch { return null; }
      }
    }

    function proxify(url) {
      return PREFIX + encode(url);
    }

    async function loadURL(url) {
      const normalized = normalizeURL(url);
      if (!normalized) {
        content.textContent = "Invalid URL";
        return;
      }

      url = normalized;
      input.value = url;
      content.innerHTML = "Loading…";

      try {
        const res = await fetch(proxify(url));
        const html = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        // Rewrite links only (proxy handles everything else)
        doc.querySelectorAll("a[href]").forEach(a => {
          const href = a.getAttribute("href");
          if (!href || href.startsWith("javascript:")) return;
          try {
            const abs = new URL(href, url).toString();
            a.setAttribute("href", proxify(abs));
          } catch {}
        });

        content.innerHTML = "";
        Array.from(doc.body.childNodes).forEach(n => content.appendChild(n));

        document.title = doc.title || "Browser";

      } catch (e) {
        content.textContent = "Failed to load: " + e.message;
      }
    }

    const input = document.getElementById("url");
    const content = document.getElementById("content");

    document.getElementById("go").onclick = () => loadURL(input.value);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") loadURL(input.value);
    });
  </script>

</body>
</html>
