<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Study Island</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f0f0f0;
    }
    #topbar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: white;
      border-bottom: 1px solid #ccc;
    }
    #url {
      flex: 1;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #go {
      padding: 8px 16px;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #content {
      flex: 1;
      overflow: auto;
      background: white;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <input id="url" placeholder="https://example.com">
    <button id="go">Go</button>
  </div>

  <div id="content">Enter a URL to begin.</div>

  <script>
    const input = document.getElementById("url");
    const content = document.getElementById("content");

    let currentUrl = null;

    function proxify(url) {
      return "/api/proxy?url=" + encodeURIComponent(url);
    }

    function absolutify(base, relative) {
      try {
        return new URL(relative, base).toString();
      } catch {
        return relative;
      }
    }

    function rewriteDocument(doc) {
      // Rewrite <img>, <script>, <link>, <video>, <audio>, <source>
      const selectors = ["img", "script", "link", "video", "audio", "source"];
      selectors.forEach(tag => {
        doc.querySelectorAll(tag).forEach(el => {
          const attr = el.tagName === "LINK" ? "href" : "src";
          const val = el.getAttribute(attr);
          if (!val) return;

          const abs = absolutify(currentUrl, val);
          el.setAttribute(attr, proxify(abs));
        });
      });

      // Rewrite CSS url(...)
      doc.querySelectorAll("style").forEach(style => {
        style.textContent = style.textContent.replace(/url\((.*?)\)/g, (m, p1) => {
          const clean = p1.replace(/['"]/g, "");
          const abs = absolutify(currentUrl, clean);
          return `url(${proxify(abs)})`;
        });
      });

      // Rewrite inline styles
      doc.querySelectorAll("[style]").forEach(el => {
        el.style.cssText = el.style.cssText.replace(/url\((.*?)\)/g, (m, p1) => {
          const clean = p1.replace(/['"]/g, "");
          const abs = absolutify(currentUrl, clean);
          return `url(${proxify(abs)})`;
        });
      });

      // Rewrite <a> navigation
      doc.querySelectorAll("a[href]").forEach(a => {
        const href = a.getAttribute("href");
        if (!href || href.startsWith("javascript:")) return;

        const abs = absolutify(currentUrl, href);
        a.addEventListener("click", e => {
          e.preventDefault();
          loadURL(abs);
        });
        a.setAttribute("href", "#");
      });

      // Rewrite form actions
      doc.querySelectorAll("form[action]").forEach(form => {
        const action = form.getAttribute("action");
        const abs = absolutify(currentUrl, action);
        form.setAttribute("action", proxify(abs));
      });
    }

    async function loadURL(url) {
      currentUrl = url;
      input.value = url;

      const res = await fetch(proxify(url));
      const html = await res.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      rewriteDocument(doc);

      content.innerHTML = "";
      Array.from(doc.body.childNodes).forEach(n => content.appendChild(n));
    }

    document.getElementById("go").onclick = () => loadURL(input.value);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") loadURL(input.value);
    });
  </script>

</body>
</html>
