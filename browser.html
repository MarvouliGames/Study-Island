<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Study Island Proxy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Ultraviolet Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet/dist/uv.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet/dist/uv.config.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet/dist/uv.handler.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet/dist/uv.rewrite.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet/dist/uv.client.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #05060a;
      color: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px;
      background: #0b0d14;
      border-bottom: 1px solid #1b1f2b;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .logo {
      font-weight: 600;
      font-size: 14px;
      color: #7dd3fc;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
      flex: 1;
    }
    button {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #1f2937;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #1f2937; }
    input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      font-size: 13px;
    }
    main {
      flex: 1;
      position: relative;
      background: #020617;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      background: #020617;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Study Island Proxy</div>
    <div class="controls">
      <button id="backBtn">←</button>
      <button id="forwardBtn">→</button>
      <input id="urlInput" type="text" placeholder="Enter a URL (https://example.com)" />
      <button id="goBtn">Go</button>
    </div>
  </header>

  <main>
    <iframe id="view" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
  </main>

  <script>
    const PREFIX = "/api/learner/";

    // Register UV Service Worker
    async function registerSW() {
      if ("serviceWorker" in navigator) {
        await navigator.serviceWorker.register(
          "https://cdn.jsdelivr.net/gh/titaniumnetwork-dev/Ultraviolet/dist/uv.sw.js",
          { scope: "/" }
        );
      }
    }

    registerSW();

    // UV Client
    const uv = new UVClient({
      prefix: PREFIX,
      bare: PREFIX,
    });

    const iframe = document.getElementById("view");
    const urlInput = document.getElementById("urlInput");
    const goBtn = document.getElementById("goBtn");
    const backBtn = document.getElementById("backBtn");
    const forwardBtn = document.getElementById("forwardBtn");

    function normalizeUrl(input) {
      input = input.trim();
      if (!input) return null;
      if (!/^https?:\/\//i.test(input)) input = "https://" + input;
      try { return new URL(input).toString(); }
      catch { return null; }
    }

    async function navigate(url) {
      const normalized = normalizeUrl(url);
      if (!normalized) return;

      const encoded = await uv.encodeUrl(normalized);
      iframe.src = PREFIX + encoded;
      urlInput.value = normalized;
    }

    goBtn.onclick = () => navigate(urlInput.value);
    urlInput.onkeydown = (e) => { if (e.key === "Enter") navigate(urlInput.value); };

    backBtn.onclick = () => history.back();
    forwardBtn.onclick = () => history.forward();
  </script>
</body>
</html>
